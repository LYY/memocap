name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tag="${GITHUB_REF_NAME}"
          sha="$(git rev-parse "${tag}^{commit}")"
          [ "$sha" = "$(git rev-parse origin/main)" ]
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - name: Verify actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" .github/workflows/ci.yml .github/workflows/release.yml
      - name: Check release contract
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: node scripts/check-release.mjs

  binaries:
    name: build (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: memocap-x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: memocap-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: memocap-x86_64-pc-windows-msvc.exe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage Linux/macOS asset
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/memocap" "${{ matrix.asset }}"
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
      - name: Stage Windows asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/memocap.exe" "${{ matrix.asset }}"
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset }}").Hash.ToLower()
          "$hash  ${{ matrix.asset }}" | Out-File -Encoding ascii "${{ matrix.asset }}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  release:
    needs: [validate, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Reconcile GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          TAG_SHA: ${{ needs.validate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check ./*.sha256
          cd "$GITHUB_WORKSPACE"

          read_release() {
            local releases matches count
            releases="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
            matches="$(jq --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)]' <<< "$releases")"
            count="$(jq 'length' <<< "$matches")"
            if [ "$count" -gt 1 ]; then
              echo "multiple releases found for $TAG" >&2
              return 1
            fi
            printf '%s' "$matches"
          }

          verify_identity() {
            local release="$1"
            [ "$(jq 'length' <<< "$release")" -eq 1 ]
           [ "$(jq -r '.[0].tag_name' <<< "$release")" = "$TAG" ]
           [ "$(jq -r '.[0].target_commitish' <<< "$release")" = "$TAG_SHA" ]
          [ "$(jq -r '.[0].draft | type' <<< "$release")" = "boolean" ]
          [ "$(jq -r '.[0].prerelease | type' <<< "$release")" = "boolean" ]
          [ "$(jq -r '.[0].assets | type' <<< "$release")" = "array" ]
           [ "$(jq -r '.[0].prerelease' <<< "$release")" = false ]
          }

          verify_asset() {
            local asset="$1" expected actual directory
            directory="$(mktemp -d)"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$directory"
            expected="$(awk '{print $1}' "release-assets/${asset}.sha256")"
            actual="$(sha256sum "$directory/$asset" | awk '{print $1}')"
            [ "$actual" = "$expected" ]
          }

          verify_known_assets() {
            local release="$1" asset count remote
            for remote in $(jq -r '.[0].assets[]?.name' <<< "$release"); do
              case "$remote" in
                memocap-x86_64-unknown-linux-gnu|memocap-aarch64-apple-darwin|memocap-x86_64-pc-windows-msvc.exe) ;;
                *) echo "unexpected release asset $remote" >&2; return 1 ;;
              esac
            done
            for asset in \
              memocap-x86_64-unknown-linux-gnu \
              memocap-aarch64-apple-darwin \
              memocap-x86_64-pc-windows-msvc.exe; do
              count="$(jq --arg asset "$asset" '[.[0].assets[]? | select(.name == $asset)] | length' <<< "$release")"
              [ "$count" -eq 1 ] || { echo "missing or duplicate release asset $asset" >&2; return 1; }
              verify_asset "$asset"
            done
          }

          verify_existing_assets() {
            local release="$1" asset count remote
            for remote in $(jq -r '.[0].assets[]?.name' <<< "$release"); do
              case "$remote" in
                memocap-x86_64-unknown-linux-gnu|memocap-aarch64-apple-darwin|memocap-x86_64-pc-windows-msvc.exe) ;;
                *) echo "unexpected release asset $remote" >&2; return 1 ;;
              esac
            done
            for asset in \
              memocap-x86_64-unknown-linux-gnu \
              memocap-aarch64-apple-darwin \
              memocap-x86_64-pc-windows-msvc.exe; do
              count="$(jq --arg asset "$asset" '[.[0].assets[]? | select(.name == $asset)] | length' <<< "$release")"
              case "$count" in
                0) ;;
                1) verify_asset "$asset" ;;
                *) echo "duplicate release asset $asset" >&2; return 1 ;;
              esac
            done
          }

          release="$(read_release)"
          if [ "$(jq 'length' <<< "$release")" -eq 0 ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$TAG_SHA" --title "$TAG" --generate-notes
            release="$(read_release)"
          fi
          verify_identity "$release"
          state="$(jq -r 'if .[0].draft then "draft" else "public" end' <<< "$release")"

          case "$state" in
            draft)
              verify_existing_assets "$release"
              for asset in \
                memocap-x86_64-unknown-linux-gnu \
                memocap-aarch64-apple-darwin \
                memocap-x86_64-pc-windows-msvc.exe; do
                count="$(jq --arg asset "$asset" '[.[0].assets[]? | select(.name == $asset)] | length' <<< "$release")"
                if [ "$count" -eq 0 ]; then
                  gh release upload "$TAG" "release-assets/$asset" --repo "$GITHUB_REPOSITORY"
                  release="$(read_release)"
                  verify_identity "$release"
                fi
              done
              verify_known_assets "$release"
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
              release="$(read_release)"
              verify_identity "$release"
              [ "$(jq -r '.[0].draft' <<< "$release")" = false ]
              verify_known_assets "$release"
              ;;
            public)
              verify_known_assets "$release"
              ;;
            *)
              echo "invalid release state $state" >&2
              exit 1
              ;;
          esac

  registry:
    needs: [validate, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Pin npm
        run: |
          npm install --global npm@11.15.0
          test "$(npm --version)" = 11.15.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify public Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          TAG_SHA: ${{ needs.validate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          expected_assets=(
            memocap-x86_64-unknown-linux-gnu
            memocap-aarch64-apple-darwin
            memocap-x86_64-pc-windows-msvc.exe
          )
          cd release-assets
          sha256sum --check ./*.sha256
          cd "$GITHUB_WORKSPACE"
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG")"
          [ "$(jq -r '.draft' <<< "$release")" = false ]
          [ "$(jq -r '.tag_name' <<< "$release")" = "$TAG" ]
          [ "$(jq -r '.target_commitish' <<< "$release")" = "$TAG_SHA" ]
          expected_names="$(printf '%s\n' "${expected_assets[@]}" | sort)"
          actual_assets="$(jq -r '[.assets[].name] | sort | join("\n")' <<< "$release")"
          [ "$actual_assets" = "$expected_names" ]
          for asset in "${expected_assets[@]}"; do
            count="$(jq --arg asset "$asset" '[.assets[] | select(.name == $asset)] | length' <<< "$release")"
            [ "$count" -eq 1 ]
            expected="$(awk '{print $1}' "release-assets/${asset}.sha256")"
            directory="$(mktemp -d)"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$directory"
            actual="$(sha256sum "$directory/$asset" | awk '{print $1}')"
            [ "$actual" = "$expected" ]
          done
      - id: registry
        name: Inspect registry package
        shell: bash
        run: |
          set -euo pipefail
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          error_file="$RUNNER_TEMP/npm-view-error"
          if npm view "$package@$version" --json > "$RUNNER_TEMP/npm-package.json" 2> "$error_file"; then
            printf 'state=present\n' >> "$GITHUB_OUTPUT"
          elif grep -q 'E404' "$error_file"; then
            printf 'state=absent\n' >> "$GITHUB_OUTPUT"
          else
            cat "$error_file" >&2
            exit 1
          fi
      - name: Publish missing package
        if: steps.registry.outputs.state == 'absent'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: npm publish --access public --provenance
      - name: Verify registry package and provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          expected_integrity="$(npm pack --dry-run --json | jq -r '.[0].integrity')"
          actual="$RUNNER_TEMP/npm-package-verified.json"
          npm view "$package@$version" --json > "$actual"
          [ "$(jq -r '.name' "$actual")" = "$package" ]
          [ "$(jq -r '.version' "$actual")" = "$version" ]
          [ "$(jq -r '.repository.url' "$actual")" = "https://github.com/LYY/memocap.git" ]
          [ "$(jq -r '.dist.integrity' "$actual")" = "$expected_integrity" ]
          verify_directory="$(mktemp -d)"
          cd "$verify_directory"
          npm init --yes >/dev/null
          npm install --ignore-scripts --package-lock=false "$package@$version"
          audit="$(npm audit signatures --json --include-attestations)"
          jq -e --arg package "$package" --arg version "$version" '
            (.verified | type == "array") and
            any(.verified[];
              .name == $package and
              .version == $version and
              .attestations.provenance.predicateType == "https://slsa.dev/provenance/v1"
            )
          ' <<< "$audit" >/dev/null
