name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tag="${GITHUB_REF_NAME}"
          sha="$(git rev-parse "${tag}^{commit}")"
          git merge-base --is-ancestor "$sha" origin/main
          ci_runs="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow CI \
            --event push \
            --branch main \
            --commit "$sha" \
            --status completed \
            --json conclusion,event,headBranch,headSha,name)"
          jq -e --arg sha "$sha" '
            any(.[]; .name == "CI" and .event == "push" and .headBranch == "main" and .headSha == $sha and .conclusion == "success")
          ' <<< "$ci_runs" >/dev/null
          tag_workflow="$(git rev-parse "$sha:.github/workflows/release.yml")"
          workflow_identity="$(git rev-parse "$GITHUB_WORKFLOW_SHA:.github/workflows/release.yml")"
          expected_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$tag"
          [ "$workflow_identity" = "$tag_workflow" ]
          [ "$GITHUB_WORKFLOW_REF" = "$expected_workflow_ref" ]
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - name: Verify actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" .github/workflows/ci.yml .github/workflows/release.yml
      - name: Check release contract
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: node scripts/check-release.mjs

  binaries:
    name: build (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: memocap-x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: memocap-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: memocap-x86_64-pc-windows-msvc.exe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage Linux/macOS asset
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/memocap" "${{ matrix.asset }}"
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
      - name: Stage Windows asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/memocap.exe" "${{ matrix.asset }}"
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset }}").Hash.ToLower()
          "$hash  ${{ matrix.asset }}`n" | Set-Content -NoNewline -Encoding ascii "${{ matrix.asset }}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  release:
    needs: [validate, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Publish verified GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          TAG_SHA: ${{ needs.validate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            memocap-x86_64-unknown-linux-gnu
            memocap-aarch64-apple-darwin
            memocap-x86_64-pc-windows-msvc.exe
          )
          release_files=()
          shopt -s nullglob
          present=(release-assets/*)
          [ "${#present[@]}" -eq 6 ]
          for path in "${present[@]}"; do
            [ -f "$path" ] && [ ! -L "$path" ]
          done
          for asset in "${assets[@]}"; do
            binary="release-assets/$asset"
            checksum="${binary}.sha256"
            [ -f "$binary" ] && [ -f "$checksum" ]
            digest="$(sha256sum "$binary" | awk '{print $1}')"
            manifest="$(tr -d '\r\n' < "$checksum")"
            [ "$manifest" = "$digest  $asset" ]
            release_files+=("$binary" "$checksum")
          done

          remote_tag_sha() {
            local reference object_type object_sha tag_object
            reference="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
            object_type="$(jq -r '.object.type' <<< "$reference")"
            object_sha="$(jq -r '.object.sha' <<< "$reference")"
            case "$object_type" in
              commit) printf '%s' "$object_sha" ;;
              tag)
                tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
                [ "$(jq -r '.object.type' <<< "$tag_object")" = commit ]
                jq -r '.object.sha' <<< "$tag_object"
                ;;
              *) return 1 ;;
            esac
          }

          verify_release() {
            local release="$1"
            [ "$(jq -r '.tagName' <<< "$release")" = "$TAG" ]
            [ "$(jq -r '.isDraft' <<< "$release")" = false ]
            [ "$(jq -r '.isPrerelease' <<< "$release")" = false ]
          }

          verify_known_assets() {
            local release="$1" remote
            while IFS= read -r -d '' remote; do
              case "$remote" in
                memocap-x86_64-unknown-linux-gnu|memocap-aarch64-apple-darwin|memocap-x86_64-pc-windows-msvc.exe|memocap-x86_64-unknown-linux-gnu.sha256|memocap-aarch64-apple-darwin.sha256|memocap-x86_64-pc-windows-msvc.exe.sha256) ;;
                *) echo "unexpected release asset $remote" >&2; return 1 ;;
              esac
            done < <(jq -j '.assets[] | .name, "\u0000"' <<< "$release")
          }

          [ "$(remote_tag_sha)" = "$TAG_SHA" ]
          if release="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets)"; then
            verify_release "$release"
            verify_known_assets "$release"
            gh release upload "$TAG" "${release_files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${release_files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --target "$TAG_SHA" --title "$TAG" --generate-notes
          fi

          [ "$(remote_tag_sha)" = "$TAG_SHA" ]
          release="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets)"
          verify_release "$release"
          verify_known_assets "$release"
          expected_names="$(printf '%s\n' "${release_files[@]##*/}" | sort)"
          actual_names="$(jq -r '.assets[].name' <<< "$release" | sort)"
          [ "$actual_names" = "$expected_names" ]

          verify_directory="$(mktemp -d)"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$verify_directory"
          for asset in "${assets[@]}"; do
            cmp --silent "release-assets/$asset" "$verify_directory/$asset"
            cmp --silent "release-assets/${asset}.sha256" "$verify_directory/${asset}.sha256"
            (cd "$verify_directory" && sha256sum --check --strict "${asset}.sha256")
          done

  registry:
    needs: [validate, release]
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - id: registry
        name: Inspect registry package
        shell: bash
        run: |
          set -euo pipefail
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          error_file="$RUNNER_TEMP/npm-view-error"
          if npm view "$package@$version" --json > "$RUNNER_TEMP/npm-package.json" 2> "$error_file"; then
            printf 'state=present\n' >> "$GITHUB_OUTPUT"
          elif ! grep -q 'E404' "$error_file"; then
            cat "$error_file" >&2
            exit 1
          elif [ "$GITHUB_RUN_ATTEMPT" -eq 1 ]; then
            printf 'state=absent\n' >> "$GITHUB_OUTPUT"
          else
            for attempt in {1..10}; do
              if npm view "$package@$version" --json > "$RUNNER_TEMP/npm-package.json" 2> "$error_file"; then
                printf 'state=present\n' >> "$GITHUB_OUTPUT"
                exit 0
              elif ! grep -q 'E404' "$error_file"; then
                cat "$error_file" >&2
                exit 1
              elif [ "$attempt" -lt 10 ]; then
                sleep 2
              fi
            done
            printf 'state=absent\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish missing package
        if: steps.registry.outputs.state == 'absent'
        shell: bash
        run: |
          set -euo pipefail
          if npm publish --access public --provenance --ignore-scripts; then
            :
          else
            echo "npm publish reported failure; checking registry visibility" >&2
          fi
      - name: Verify registry package and provenance
        if: always()
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          TAG_SHA: ${{ needs.validate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          expected_integrity="$(npm pack --ignore-scripts --dry-run --json | jq -r '.[0].integrity')"
          actual="$RUNNER_TEMP/npm-package-verified.json"
          normalize_repository_url() {
            local repository="$1"
            repository="${repository#git+}"
            repository="${repository%/}"
            repository="${repository%.git}"
            printf '%s' "$repository"
          }
          expected_repository="$(normalize_repository_url "$(node -p "require('./package.json').repository.url")")"
          expected_workflow=".github/workflows/release.yml"
          expected_ref="refs/tags/$TAG"
          expected_run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          provenance_matches() {
            local audit="$1" payload statement
            while IFS= read -r payload; do
              statement="$(node -e 'process.stdout.write(Buffer.from(process.argv[1], "base64").toString("utf8"))' "$payload")" || continue
              if jq -e \
                --arg repository "$expected_repository" \
                --arg workflow "$expected_workflow" \
                --arg ref "$expected_ref" \
                --arg sha "$TAG_SHA" \
                --arg run "$expected_run" '
                  .predicate.buildDefinition.externalParameters.workflow as $provenance_workflow |
                  (.predicate.runDetails.metadata.invocationId | strings) as $provenance_invocation |
                  $provenance_workflow.repository == $repository and
                  $provenance_workflow.path == $workflow and
                  $provenance_workflow.ref == $ref and
                  any(.predicate.buildDefinition.resolvedDependencies[]?;
                    .uri == ("git+" + $repository + "@" + $ref) and
                    .digest.gitCommit == $sha
                  ) and
                  ($provenance_invocation | startswith($run + "/attempts/")) and
                  ($provenance_invocation | ltrimstr($run + "/attempts/") | test("^[1-9][0-9]*$"))
                ' <<< "$statement" >/dev/null; then
                return 0
              fi
            done < <(
              jq -r --arg package "$package" --arg version "$version" '
                .verified[]? |
                select(.name == $package and .version == $version) |
                .attestationBundles[]? |
                select(.predicateType == "https://slsa.dev/provenance/v1") |
                .bundle.dsseEnvelope.payload // empty
              ' <<< "$audit"
            )
            return 1
          }
          registry_matches() {
            npm view "$package@$version" --json > "$actual" || return 1
            [ "$(jq -r '.name' "$actual")" = "$package" ] || return 1
            [ "$(jq -r '.version' "$actual")" = "$version" ] || return 1
            registry_repository="$(normalize_repository_url "$(jq -r '.repository.url' "$actual")")"
            [ "$registry_repository" = "$expected_repository" ] || return 1
            [ "$(jq -r '.dist.integrity' "$actual")" = "$expected_integrity" ] || return 1
            verify_directory="$(mktemp -d)"
            (
              npm install --ignore-scripts --package-lock=false --prefix "$verify_directory" "$package@$version" || exit 1
              cd "$verify_directory"
              audit="$(npm audit signatures --json --include-attestations)" || exit 1
              provenance_matches "$audit"
            )
          }

          for verification_attempt in {1..10}; do
            if registry_matches; then
              exit 0
            fi
            if [ "$verification_attempt" -lt 10 ]; then
              sleep 2
            fi
          done
          echo "registry package or provenance did not become visible" >&2
          exit 1
