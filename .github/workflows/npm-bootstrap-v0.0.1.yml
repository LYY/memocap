name: npm bootstrap v0.0.1

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Enter PUBLISH_V0_0_1 to publish the independently released package.
        required: true
        type: string

concurrency:
  group: npm-publish-lyy-gh-memocap-v0-0-1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.event.inputs.confirm == 'PUBLISH_V0_0_1'
    runs-on: ubuntu-24.04
    environment: npm-bootstrap-v0-0-1
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: v0.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.20.0"
          registry-url: "https://registry.npmjs.org"
      - name: Pin npm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.15.0
          test "$(npm --version)" = 11.15.0
      - name: Verify tag, Release, and package source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.0.1
          TAG_SHA: 9e9dabe5a59b7e74decb376a0e0c4e5b1218b9a2
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TAG_SHA"
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          test "$package" = "@lyy-gh/memocap"
          test "$version" = "0.0.1"
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG")"
          jq -e --arg tag "$TAG" --arg sha "$TAG_SHA" '
            .tag_name == $tag and
            .target_commitish == $sha and
            .draft == false and
            .prerelease == false and
            ([.assets[] | {name, digest}] | sort_by(.name)) == [
              {"name":"memocap-aarch64-apple-darwin","digest":"sha256:21bdff7613261ed77fa38048c67c6cb11af9b33ec647b6cdc9540b644c0ce71b"},
              {"name":"memocap-aarch64-apple-darwin.sha256","digest":"sha256:b8e0f852a82b73220eec313526e432acf0f7c2031d6954be2219d556b2255c28"},
              {"name":"memocap-x86_64-pc-windows-msvc.exe","digest":"sha256:67badb0454d1e8b71e65cff0b50b69a75e015eb1bd3c48d8a5264a8817638eff"},
              {"name":"memocap-x86_64-pc-windows-msvc.exe.sha256","digest":"sha256:a2c5a9dceb9fc087a4e0ff780efe120af62dd95998157a7fcbf2360c4b9358be"},
              {"name":"memocap-x86_64-unknown-linux-gnu","digest":"sha256:086414ab78770e512c1c8f7f6bab39bef05e4d21f85f11b8172e3a8c18a57c16"},
              {"name":"memocap-x86_64-unknown-linux-gnu.sha256","digest":"sha256:ba42b64b266157cc9d6b7fe6bce897a2793e7ca2bb87a8f22bf8c63a4e058c12"}
            ]
          ' <<< "$release" >/dev/null
          error_file="$RUNNER_TEMP/npm-package-before-error"
          if npm view "$package@$version" --json > "$RUNNER_TEMP/npm-package-before.json" 2> "$error_file"; then
            echo "refusing to publish an existing package version" >&2
            exit 1
          elif ! grep -q 'E404' "$error_file"; then
            cat "$error_file" >&2
            exit 1
          fi
      - name: Publish v0.0.1 package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN"
          npm publish --access public --provenance
      - name: Verify fresh registry metadata, integrity, and provenance
        shell: bash
        run: |
          set -euo pipefail
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          expected_integrity="$(npm pack --dry-run --json | jq -er '.[0].integrity')"
          metadata="$RUNNER_TEMP/npm-package-verified.json"
          metadata_ready=false
          for attempt in {1..10}; do
            fresh_cache="$(mktemp -d)"
            if NPM_CONFIG_CACHE="$fresh_cache" npm view "$package@$version" --json > "$metadata" && \
              test "$(jq -r '.name' "$metadata")" = "$package" && \
              test "$(jq -r '.version' "$metadata")" = "$version" && \
              test "$(jq -r '.repository.url' "$metadata")" = "https://github.com/LYY/memocap.git" && \
              test "$(jq -r '.dist.integrity' "$metadata")" = "$expected_integrity"; then
              metadata_ready=true
              break
            fi
            sleep 6
          done
          if [ "$metadata_ready" != true ]; then
            echo "registry metadata did not verify after $attempt attempts" >&2
            exit 1
          fi
          provenance_ready=false
          for attempt in {1..10}; do
            fresh_cache="$(mktemp -d)"
            verify_directory="$(mktemp -d)"
            cd "$verify_directory"
            npm init --yes >/dev/null
            if NPM_CONFIG_CACHE="$fresh_cache" npm install --ignore-scripts --package-lock=false "$package@$version" && \
              audit="$(NPM_CONFIG_CACHE="$fresh_cache" npm audit signatures --json --include-attestations)" && \
              jq -e --arg package "$package" --arg version "$version" '
                (.verified | type == "array") and
                any(.verified[];
                  .name == $package and
                  .version == $version and
                  any(.attestationBundles[]?; .predicateType == "https://slsa.dev/provenance/v1")
                )
              ' <<< "$audit" >/dev/null; then
              provenance_ready=true
              break
            fi
            sleep 6
          done
          if [ "$provenance_ready" != true ]; then
            echo "registry provenance did not verify after $attempt attempts" >&2
            exit 1
          fi
