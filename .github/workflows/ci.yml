name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build native packaged acceptance binary
        id: native_build
        run: cargo build --bin memocap
      - name: Test
        run: cargo test
      - name: Test Node contracts
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: node --test tests/*.test.cjs
      - name: Test packaged lifecycle and official OpenCode 1.19.3
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: bash
        env:
          MEMOCAP_OPENCODE_INTEGRATION: "1"
          MEMOCAP_TEST_LINUX_OFFLINE: ${{ runner.os == 'Linux' && '1' || '0' }}
          MEMOCAP_TEST_HOST_EVIDENCE: ${{ runner.temp }}/task-8-${{ runner.os }}.json
        run: |
          node --test tests/opencode-v1.integration.test.cjs
      - name: Upload native packaged acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task-8-${{ runner.os }}
          path: |
            ${{ runner.temp }}/task-8-${{ runner.os }}.json
            ${{ runner.temp }}/memocap-link-journals/
          if-no-files-found: error
          retention-days: 7

  release-build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: memocap-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/memocap*
          if-no-files-found: error
          retention-days: 7

  package-contract:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" .github/workflows/ci.yml .github/workflows/release.yml
      - name: Check release contract
        env:
          RELEASE_TAG: v0.3.0
        run: node scripts/check-release.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check Node syntax
        run: |
          node --check bin/cli.cjs
          node --check scripts/check-release.mjs
      - name: Check package payload
        run: npm pack --dry-run --json
